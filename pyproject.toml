[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptopulse"
version = "1.0.0"
description = "CRYPTO PULSE AI — early-acceleration crypto scanner with explainable scoring and honest data provenance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
cryptopulse = "cryptopulse.cli:main"

[tool.setuptools.packages.find]
include = ["cryptopulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731", "B008", "E741", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal arrays in test fixtures read better unwrapped

[tool.ruff.lint.pycodestyle]
max-line-length = 125
