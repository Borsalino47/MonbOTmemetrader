<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch and the gesture
         bar; the CSS already reserves space with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d12" />
    <meta name="description" content="Scanner d'accélération crypto — quel actif change de comportement maintenant." />

    <title>CRYPTO PULSE AI</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <!-- iOS ignores the manifest icons and reads this one. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Crypto Pulse" />
    <meta name="mobile-web-app-capable" content="yes" />

    <style>
      /* Painted before the bundle parses, so launching from the home screen
         shows the app's own ground rather than a white flash. */
      html, body { margin: 0; background: #0a0d12; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
